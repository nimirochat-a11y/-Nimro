plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"

}

// SECURITY (S4): read the release signing material from key.properties. The
// file (and the keystore it points at) is git-ignored, so CI injects it as a
// secret and local builds without it fall back to the debug key with a loud
// warning instead of silently shipping a debug-signed build.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.retrytech.nimiro"
    compileSdk = 36
    ndkVersion "29.0.14033849"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.nimiro.app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 24
        targetSdk = 36
        versionCode = 15
        versionName = '1.1.5'
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
                storeFile = file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // CRASH FIX (1.1.5): R8 / ProGuard minification is DISABLED.
            //
            // SECURITY (S9) previously turned on `minifyEnabled true` together
            // with `shrinkResources true`. The result was a release APK that
            // opened, drew the splash screen, and then died immediately —
            // exactly the launch crash reported against build 1.1.3 (code 13).
            //
            // This failure was ALREADY diagnosed and fixed on branch
            // `fix/release-crash-v3` (commit 56455b42). That fix was never
            // merged into this branch, so the regression shipped a second time
            // with the security hardening work.
            //
            // Flutter plus this app's plugin set (ZEGO Express, DeepAR, Google
            // MLKit, RevenueCat, Supabase/Kotlinx serialization and the
            // Firebase/Gson models) resolves a large amount of code and
            // resources reflectively at runtime. R8 full mode stripped and
            // renamed members that are reachable only through reflection, so
            // the process died during startup while every backend request still
            // returned HTTP 200 — which is why the crash did not look like a
            // network or auth problem.
            //
            // Keep this in sync with `fix/release-crash-v3`. R8 may only be
            // re-enabled once the keep rules in `proguard-rules.pro` have been
            // validated on a real device.
            shrinkResources false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // SECURITY (S4): never sign a release with the debug key. The
            // fallback keeps `flutter run --release` usable for local testing;
            // CI must supply key.properties.
            if (keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.release
            } else {
                signingConfig = signingConfigs.debug
                logger.warn("WARNING: key.properties not found — app-release is signed with the DEBUG key and must not be published.")
            }
        }
    }

}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
flutter {
    source = "../.."
}
