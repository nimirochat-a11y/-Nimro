name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'security/**'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Nimiro release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/system-images
          sudo rm -rf /usr/local/lib/android/sdk/emulator
          sudo rm -rf /usr/local/lib/android/sdk/platform-tools
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/lib/android/sdk/ndk/*
          docker system prune -af || true
          df -h "$GITHUB_WORKSPACE"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Static analysis. Non-fatal on purpose: this branch fixes security
      # defects, and the pre-existing lint backlog is tracked separately.
      - name: Analyze
        continue-on-error: true
        run: flutter analyze

      - name: Clean runner caches before Android build
        run: |
          rm -rf "$HOME/.gradle/caches" "$HOME/.gradle/wrapper/dists"
          rm -rf android/.gradle build
          df -h "$GITHUB_WORKSPACE" "$HOME"

      - name: Accept Android SDK licenses and install NDK
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;29.0.14033849"

      # SECURITY: the API key is no longer compiled into the source tree, and
      # releases are no longer signed with the debug key. Both come from
      # repository secrets. Without the keystore the gradle build falls back to
      # the debug key and warns, so this step is what makes a publishable APK.
      - name: Materialise release keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release.jks
          EOF

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=NIMIRO_API_KEY="${{ secrets.NIMIRO_API_KEY }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nimiro-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
