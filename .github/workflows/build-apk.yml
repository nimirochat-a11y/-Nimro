name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_aab:
        description: "Also build the Play Store AAB bundle"
        type: boolean
        required: false
        default: true
  push:
    branches:
      - main
      - 'security/**'

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Nimiro release Android artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/system-images
          sudo rm -rf /usr/local/lib/android/sdk/emulator
          sudo rm -rf /usr/local/lib/android/sdk/platform-tools
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/lib/android/sdk/ndk/*
          docker system prune -af || true
          df -h "$GITHUB_WORKSPACE"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Static analysis. Non-fatal on purpose: this branch fixes security
      # defects, and the pre-existing lint backlog is tracked separately.
      - name: Analyze
        continue-on-error: true
        run: flutter analyze

      - name: Clean runner caches before Android build
        run: |
          rm -rf "$HOME/.gradle/caches" "$HOME/.gradle/wrapper/dists"
          rm -rf android/.gradle build
          df -h "$GITHUB_WORKSPACE" "$HOME"

      - name: Accept Android SDK licenses and install NDK
        run: |
          set -e
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;29.0.14033849"

      # SECURITY: the API key is no longer compiled into the source tree, and
      # releases are no longer signed with the debug key. Both come from
      # repository secrets. Without the keystore the gradle build falls back to
      # the debug key and warns, so this step is what makes a publishable APK.
      #
      # NOTE: the `secrets` context is NOT available in a step-level `if`
      # expression, so presence is checked inside the shell instead.
      - name: Configure release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::warning title=Debug-signed build::KEYSTORE_BASE64 is not set, so the artifacts are signed with the DEBUG key and must NOT be published to any store."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          {
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=release.jks\n'
          } > android/key.properties
          chmod 600 android/app/release.jks android/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "::notice title=Release signing::keystore materialised from repository secrets."

      - name: Guard - release API key present
        env:
          NIMIRO_API_KEY: ${{ secrets.NIMIRO_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${NIMIRO_API_KEY:-}" ]; then
            echo "::error title=Missing repository secret NIMIRO_API_KEY::The app no longer ships a hardcoded API key, so the release build must receive one via --dart-define. Add a repository secret named NIMIRO_API_KEY, then re-run this workflow. Its value is never printed."
            exit 1
          fi
          echo "::notice title=API key::NIMIRO_API_KEY is present (value never printed)."

      - name: Build release APK
        env:
          NIMIRO_API_KEY: ${{ secrets.NIMIRO_API_KEY }}
        run: flutter build apk --release --dart-define=NIMIRO_API_KEY="$NIMIRO_API_KEY"

      # NOTE: `inputs` is empty on push events, so it must be defaulted with
      # `|| 'true'` before comparing — otherwise this step is skipped on every
      # push and the AAB is never produced.
      - name: Build release AAB
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_aab != false }}
        env:
          NIMIRO_API_KEY: ${{ secrets.NIMIRO_API_KEY }}
        run: flutter build appbundle --release --dart-define=NIMIRO_API_KEY="$NIMIRO_API_KEY"

      - name: Write build summary
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          AAB="build/app/outputs/bundle/release/app-release.aab"
          {
            echo "## Nimiro Android build"
            echo ""
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Signed with the release key: \`${{ steps.signing.outputs.signed }}\`"
            echo ""
            echo "| File | Size | SHA-256 |"
            echo "| --- | --- | --- |"
            if [ -f "$APK" ]; then
              echo "| app-release.apk | $(du -h "$APK" | cut -f1) | \`$(sha256sum "$APK" | cut -d' ' -f1)\` |"
            fi
            if [ -f "$AAB" ]; then
              echo "| app-release.aab | $(du -h "$AAB" | cut -f1) | \`$(sha256sum "$AAB" | cut -d' ' -f1)\` |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nimiro-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: nimiro-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
          retention-days: 14

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties android/app/release.jks || true
